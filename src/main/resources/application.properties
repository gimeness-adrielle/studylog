spring.application.name=studylog
spring.config.import=optional:file:.env[.properties]

# Docker
spring.docker.compose.file=compose.yaml
spring.docker.compose.lifecycle-management=start-only

# Database PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/studylog
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring AI
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.temperature=0.8
spring.ai.google.genai.chat.response-mime-type=text/plain

# Dev
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.ai=DEBUG